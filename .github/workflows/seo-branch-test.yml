name: SEO branch test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'public/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

# Workflow mirrored on main so pull-request checks can run before SEO changes are merged.
